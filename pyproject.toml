[project]
name = "cpsl_datasets"
version = "2.0.0"
description = "Access CPSL datasets"
authors = [{ name = "David Hunt", email = "dmh89@duke.edu" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.25,<2",
    "scipy>=1.11.4",
    "matplotlib>=3.8.2",
    "opencv-python>4.7,<4.9.0.80",
    "imageio[ffmpeg]>=2.33.1",
    "tqdm>=4.66.1",
    "h5py",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0.0", "ipywidgets>=8.1.1"]
athena = ["geometries"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "pytest",
]

[tool.uv.sources]
geometries = { path = "submodules/geometries", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["cpsl_datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
